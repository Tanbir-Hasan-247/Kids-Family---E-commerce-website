<aside class="w-full md:w-1/4 shrink-0">

    <!-- MOBILE: horizontal scroll tab bar -->
    <div class="md:hidden -mx-4 px-4 mb-8 overflow-x-auto no-scrollbar">
        <nav class="flex gap-2 w-max">
            <a href="{% url 'dashboard' %}" class="flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap border transition {% if request.path == '/dashboard/' %}bg-pine text-cream border-pine font-semibold{% else %}border-ink/15 text-ink/65{% endif %}">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            <a href="{% url 'orders:order_history' %}" class="flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap border transition {% if '/orders/' in request.path %}bg-pine text-cream border-pine font-semibold{% else %}border-ink/15 text-ink/65{% endif %}">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                My Orders
            </a>
            <a href="/favorites/" class="flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap border transition {% if '/favorites/' in request.path %}bg-pine text-cream border-pine font-semibold{% else %}border-ink/15 text-ink/65{% endif %}">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                Wishlist
            </a>
            <a href="/account/" class="flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap border transition {% if '/account/' in request.path %}bg-pine text-cream border-pine font-semibold{% else %}border-ink/15 text-ink/65{% endif %}">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Account
            </a>
            <button type="submit" form="mobile-logout-form" class="flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap border border-clay/30 text-clay">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Log out
            </button>
        </nav>
        <form id="mobile-logout-form" method="POST" action="{% url 'logout' %}" class="hidden">{% csrf_token %}</form>
    </div>

    <!-- DESKTOP: full vertical sidebar -->
    <div class="hidden md:block bg-paper border border-ink/10 p-4 md:sticky md:top-24">
        <div class="mb-6 px-4">
            <p class="text-[11px] text-ink/50 uppercase tracking-widest mb-1">Hello,</p>
            <p class="text-base font-semibold text-ink truncate">{{ request.user.full_name|default:request.user.email }}</p>
        </div>

        <nav class="space-y-1">
            <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-3 text-sm {% if request.path == '/dashboard/' %}font-semibold bg-pine/5 text-pine border-l-2 border-pine{% else %}font-medium text-ink/70 hover:bg-cream hover:text-ink transition border-l-2 border-transparent{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            <a href="{% url 'orders:order_history' %}" class="flex items-center gap-3 px-4 py-3 text-sm {% if '/orders/' in request.path %}font-semibold bg-pine/5 text-pine border-l-2 border-pine{% else %}font-medium text-ink/70 hover:bg-cream hover:text-ink transition border-l-2 border-transparent{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                My Orders
            </a>
            <a href="/favorites/" class="flex items-center gap-3 px-4 py-3 text-sm {% if '/favorites/' in request.path %}font-semibold bg-pine/5 text-pine border-l-2 border-pine{% else %}font-medium text-ink/70 hover:bg-cream hover:text-ink transition border-l-2 border-transparent{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                Wishlist
            </a>
            <a href="/account/" class="flex items-center gap-3 px-4 py-3 text-sm {% if '/account/' in request.path %}font-semibold bg-pine/5 text-pine border-l-2 border-pine{% else %}font-medium text-ink/70 hover:bg-cream hover:text-ink transition border-l-2 border-transparent{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Account Details
            </a>
        </nav>

        <div class="mt-6 pt-6 border-t border-ink/10 px-4">
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="flex items-center gap-3 text-sm font-medium text-clay hover:text-clay/80 transition w-full text-left">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Log out
                </button>
            </form>
        </div>
    </div>
</aside>
