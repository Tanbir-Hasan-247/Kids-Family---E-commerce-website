{% extends "base.html" %}

{% block content %}

<!-- add_product.html -->
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    {{ formset.management_form }}
    {% for variant_form in formset %}
        <div class="variant-row">
            {{ variant_form.as_p }}
        </div>
    {% endfor %}

    <button type="submit">Save Product</button>
</form>

{% endblock %}
